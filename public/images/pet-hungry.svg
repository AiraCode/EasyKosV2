<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C84628"/>
    </linearGradient>
  </defs>

  <!-- House Frame -->
  <path d="M 100 15 L 180 75 L 180 175 L 20 175 L 20 75 Z" fill="none" stroke="url(#tealGrad)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Left Bubble: Stomach Rumble / Hunger -->
  <g transform="translate(15, 25)">
    <ellipse cx="25" cy="20" rx="20" ry="15" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="40" cy="33" r="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M 15 20 Q 20 12 25 20 T 35 20" fill="none" stroke="#C84628" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Right Bubble: Crossed Nut / No Acorn -->
  <g transform="translate(140, 20)">
    <circle cx="20" cy="20" r="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="8" cy="34" r="3.5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M 14 22 L 26 14" stroke="#9A3412" stroke-width="6" stroke-linecap="round"/>
    <line x1="8" y1="8" x2="32" y2="32" stroke="#EF4444" stroke-width="3"/>
  </g>

  <!-- Squirrel Tail Drooping -->
  <path d="M 45 130 C 10 120 -15 85 15 65 C 45 45 65 80 50 115 Z" fill="url(#orangeGrad)"/>

  <!-- Body & White Tummy -->
  <ellipse cx="100" cy="122" rx="48" ry="48" fill="url(#orangeGrad)"/>
  <ellipse cx="100" cy="130" rx="28" ry="30" fill="#F8FAFC"/>

  <!-- Ears -->
  <polygon points="72,75 58,42 88,62" fill="url(#orangeGrad)"/>
  <polygon points="74,72 63,48 85,62" fill="#334155"/>
  <polygon points="128,75 142,42 112,62" fill="url(#orangeGrad)"/>
  <polygon points="126,72 137,48 115,62" fill="#334155"/>

  <!-- White Muzzle -->
  <ellipse cx="100" cy="98" rx="35" ry="22" fill="#FFFFFF"/>

  <!-- Sad Eyes & Tear Drop -->
  <path d="M 76 86 Q 84 94 92 88" fill="none" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
  <path d="M 108 88 Q 116 94 124 86" fill="none" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>

  <!-- Tear Drop on cheek -->
  <path d="M 125 96 C 122 102 125 108 128 108 C 131 108 134 102 131 96 Z" fill="#38BDF8"/>

  <!-- Nose & Frowning Mouth -->
  <ellipse cx="100" cy="96" rx="6" ry="4" fill="#1E293B"/>
  <path d="M 92 110 Q 100 100 108 110" fill="none" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>

  <!-- Hands on Tummy -->
  <circle cx="75" cy="135" r="9" fill="url(#orangeGrad)"/>
  <circle cx="125" cy="135" r="9" fill="url(#orangeGrad)"/>
</svg>
