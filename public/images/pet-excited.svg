<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C84628"/>
    </linearGradient>
  </defs>

  <!-- House Frame -->
  <path d="M 100 15 L 180 75 L 180 175 L 20 175 L 20 75 Z" fill="none" stroke="url(#tealGrad)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Sparkles -->
  <path d="M 30 35 L 35 45 L 45 50 L 35 55 L 30 65 L 25 55 L 15 50 L 25 45 Z" fill="#FBBF24"/>
  <path d="M 170 35 L 173 42 L 180 45 L 173 48 L 170 55 L 167 48 L 160 45 L 167 42 Z" fill="#FBBF24"/>

  <!-- Squirrel Tail -->
  <path d="M 45 125 C 10 110 -10 70 20 45 C 50 20 70 60 55 100 Z" fill="url(#orangeGrad)"/>

  <!-- Body & White Tummy -->
  <ellipse cx="100" cy="120" rx="48" ry="50" fill="url(#orangeGrad)"/>
  <ellipse cx="100" cy="128" rx="28" ry="32" fill="#F8FAFC"/>

  <!-- Ears -->
  <polygon points="72,75 58,42 88,62" fill="url(#orangeGrad)"/>
  <polygon points="74,72 63,48 85,62" fill="#334155"/>
  <polygon points="128,75 142,42 112,62" fill="url(#orangeGrad)"/>
  <polygon points="126,72 137,48 115,62" fill="#334155"/>

  <!-- White Muzzle -->
  <ellipse cx="100" cy="98" rx="35" ry="22" fill="#FFFFFF"/>

  <!-- Starry Eyes -->
  <polygon points="88,80 91,86 97,87 93,91 94,97 88,94 82,97 83,91 79,87 85,86" fill="#1E293B"/>
  <polygon points="112,80 115,86 121,87 117,91 118,97 112,94 106,97 107,91 103,87 109,86" fill="#1E293B"/>

  <!-- Nose & Big Open Smile -->
  <ellipse cx="100" cy="93" rx="6" ry="4" fill="#1E293B"/>
  <path d="M 82 98 Q 100 124 118 98 Z" fill="#1E293B"/>
  <rect x="96" y="98" width="8" height="7" fill="#FFFFFF" rx="1"/>
  <path d="M 94 115 Q 100 122 106 115" fill="#F43F5E"/>

  <!-- Double Thumbs Up -->
  <path d="M 140 120 C 158 120 165 105 162 92 C 158 84 148 86 145 96 L 135 108 Z" fill="url(#orangeGrad)"/>
  <circle cx="156" cy="90" r="6" fill="url(#orangeGrad)"/>
</svg>
